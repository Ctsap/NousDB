# Models NousDB knows out of the box.
#
# `context_window` and `max_output_tokens` are the serving limits; set them to
# what your deployment allows (for vLLM, `--max-model-len`). The batch-size
# fields are NousDB defaults: `quality_max_batch_size` is the largest batch at
# which the model kept its per-row accuracy in our measurements, and
# `max_concurrent_requests` suits a vLLM server.
#
# Add or override models with `ModelCatalog::with_card` or a TOML file of the
# same shape loaded with `ModelCatalog::from_file`.

[[models]]
id = "gpt-4o-mini"
name = "GPT-4o mini"
context_window = 128000
max_output_tokens = 16384
max_batch_size = 200
pricing = { input_per_1k_tokens = 0.00015, output_per_1k_tokens = 0.0006 }

