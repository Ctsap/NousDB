[package]
name = "nousdb-sql"
description = "SQL functions for NousDB's semantic operators: EXTEND, SEM_FILTER, SEM_JOIN and GENERATE"
readme = "README.md"
documentation = "https://docs.rs/nousdb-sql"
include = ["src/**", "tests/**", "README.md", "LICENSE", "!.DS_Store"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# `sql`: the relation planner and the sqlparser AST.
datafusion = { workspace = true, features = ["sql"] }
log.workspace = true
nousdb-operators.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
